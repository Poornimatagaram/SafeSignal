# Enforces CONTRIBUTING.md on every pull request (including stacked PRs), and keeps main green.
name: CI

on:
  pull_request:          # every PR, including PRs stacked on another branch
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Ownership and commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Only the branch owner's folders changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/check_ownership.sh "${HEAD_REF%%/*}"
      - name: Commits and PR title follow Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check_commits.sh --title "$PR_TITLE"

  contract-and-service:
    name: Contract and service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Contract tests
        working-directory: packages/contract-py
        run: uv run --frozen pytest -q
      - name: Service tests
        working-directory: apps/service
        run: uv run --frozen pytest -q
      - name: End-to-end check across all personas (throwaway service)
        run: uv run --frozen --project apps/service python scripts/e2e_check.py
      - name: Generated contract files are up to date
        run: |
          uv run --frozen --project packages/contract-py python scripts/build_examples.py
          uv run --frozen --project apps/service python scripts/export_openapi.py
          git diff --exit-code -- schema/

  company-web:
    name: Company portal (lint and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/company-web
        run: npm ci
      - name: Lint and build
        working-directory: apps/company-web
        run: npm run lint && npm run build

  # Patient side (D-087). Tests that need Ollama, the cached Whisper model, macOS `say`, ffmpeg or a live
  # service on 127.0.0.1:8000 skip themselves here; everything else (filter, rules, egress gate with a fake
  # transport, privacy guards, leakage and re-ask harnesses) runs on every PR.
  patient-runtime:
    name: Patient runtime and evals (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/patient-runtime/uv.lock
      - name: Runtime tests
        working-directory: apps/patient-runtime
        run: uv run --frozen pytest -q
      - name: Patient evals
        run: uv run --frozen --project apps/patient-runtime pytest -q evals/patient

  patient-web:
    name: Patient screen (tests and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/patient-web/package-lock.json
      - name: Install
        working-directory: apps/patient-web
        run: npm ci
      - name: Tests and build
        working-directory: apps/patient-web
        run: npm test && npm run build

  contract-ts:
    name: Contract (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hash vectors
        run: npm test --prefix packages/contract-ts
