      <script>
        (function () {
          const L = 0.4; // matches data-start of #s7-narration
          const N = window.NARRATION_S7.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 12.1;
          if (L + window.NARRATION_S7.duration > SCENE_LEN) {
            console.warn("scene 7 narration is longer than the scene: raise its data-duration in index.html");
          }

          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const tl = gsap.timeline({ paused: true });
          const cut = t(1) - 0.3; // the cut to the doctor's cabin
          gsap.set("#s7-camA", { transformOrigin: "0 0", ...cam(960, 540, 1.0) });
          tl.to("#s7-camA", { ...cam(1000, 520, 1.04), duration: cut, ease: "sine.inOut" }, 0.2);
          gsap.set("#s7-camB", { transformOrigin: "0 0", ...cam(1000, 540, 1.0) });
          tl.to("#s7-camB", { ...cam(1060, 520, 1.05), duration: SCENE_LEN - cut - 0.2, ease: "sine.inOut" }, cut + 0.2);

          // opening fade, then the cut: a quick fade through porcelain, stage A out, stage B in
          tl.fromTo("#s7-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
          tl.to("#s7-cover", { opacity: 1, duration: 0.25, ease: "power1.in" }, cut - 0.25);
          gsap.set("#s7-B", { opacity: 0 });
          tl.set("#s7-A", { opacity: 0 }, cut);
          tl.set("#s7-B", { opacity: 1 }, cut);
          tl.to("#s7-cover", { opacity: 0, duration: 0.35, ease: "power2.out" }, cut + 0.02);

          // ---- Stage A: "His doctor gets a sealed copy only his care team can open."
          gsap.set("#s7-phone", { svgOrigin: "320 590", scale: 0.9, opacity: 0 });
          tl.to("#s7-phone", { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 0.25);
          gsap.set("#s7-clinic", { svgOrigin: "1520 570", scale: 0.95, opacity: 0 });
          tl.to("#s7-clinic", { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
          tl.fromTo("#s7-sealLbl", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, t(0) + 0.9);
          // the envelope rises out of the phone, seal snaps shut, then flies to Northgate along the dotted arc
          gsap.set("#s7-env", { x: 320, y: 560, scale: 0.3, opacity: 0, rotation: -8 });
          tl.to("#s7-env", { opacity: 1, scale: 1, y: 470, duration: 0.55, ease: "back.out(1.5)" }, t(0) + 0.5);
          tl.to("#s7-trail", { opacity: 0.7, duration: 0.3 }, t(0) + 1.0);
          tl.to("#s7-env", { x: 1440, duration: 1.5, ease: "power2.inOut" }, t(0) + 1.2);
          tl.to("#s7-env", { y: 250, duration: 0.75, ease: "power2.out" }, t(0) + 1.2);
          tl.to("#s7-env", { y: 560, duration: 0.75, ease: "power2.in" }, t(0) + 1.95);
          tl.to("#s7-env", { rotation: 8, duration: 1.5, ease: "sine.inOut" }, t(0) + 1.2);
          tl.to("#s7-env", { scale: 0.6, opacity: 0, duration: 0.3, ease: "power2.in" }, t(0) + 2.65);
          tl.fromTo("#s7-clinic", { scale: 1 }, { scale: 1.03, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(0) + 2.85);

          // ---- Stage B: "When Walter walks in, the history is already there, and the follow-up questions write themselves."
          gsap.set("#s7-wSeated", { opacity: 0 });
          gsap.set(["#s7-pArm", "#s7-rash", "#s7-wSmile", "#s7-dSmile"], { opacity: 0 });
          gsap.set(["#s7-panel", "#s7-sugg", "#s7-bubble"], { opacity: 0 });
          for (let i = 0; i < 7; i++) {
            const cx = 826 + i * 90;
            gsap.set("#s7-b" + i, { svgOrigin: cx + " 396", scaleY: 0 });
          }
          gsap.set("#s7-rashTag", { opacity: 0 });

          // breathing and blinks
          gsap.set("#s7-dTorso", { svgOrigin: "600 740" });
          tl.fromTo("#s7-dTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, cut);
          gsap.set(["#s7-dEyeL", "#s7-dEyeR"], { svgOrigin: "600 353" });
          tl.to(["#s7-dEyeL", "#s7-dEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, cut + 2.2);
          gsap.set("#s7-dHead", { svgOrigin: "600 430" });

          // Walter walks in from the right, with a bobbing step and swinging legs and arms
          const walkStart = t(1) + 0.1, walkLen = 1.5, sitAt = walkStart + walkLen + 0.15;
          gsap.set("#s7-wWalk", { x: 2250, y: 0 });
          tl.to("#s7-wWalk", { x: 1560, duration: walkLen, ease: "none" }, walkStart);
          const steps = 6;
          gsap.set(["#s7-legL", "#s7-legR"], { svgOrigin: "0 740" });
          gsap.set(["#s7-armL", "#s7-armR"], { svgOrigin: "0 504" });
          tl.fromTo("#s7-legL", { rotation: -14 }, { rotation: 14, duration: walkLen / steps, ease: "sine.inOut", yoyo: true, repeat: steps - 1, immediateRender: false }, walkStart);
          tl.fromTo("#s7-legR", { rotation: 14 }, { rotation: -14, duration: walkLen / steps, ease: "sine.inOut", yoyo: true, repeat: steps - 1, immediateRender: false }, walkStart);
          tl.fromTo("#s7-armL", { rotation: 10 }, { rotation: -10, duration: walkLen / steps, ease: "sine.inOut", yoyo: true, repeat: steps - 1, immediateRender: false }, walkStart);
          tl.fromTo("#s7-armR", { rotation: -10 }, { rotation: 10, duration: walkLen / steps, ease: "sine.inOut", yoyo: true, repeat: steps - 1, immediateRender: false }, walkStart);
          tl.fromTo("#s7-wBob", { y: 0 }, { y: -9, duration: walkLen / (steps * 2), ease: "sine.inOut", yoyo: true, repeat: steps * 2 - 1, immediateRender: false }, walkStart);
          // he sits: the walking figure hands over to the seated one
          tl.to("#s7-wWalk", { opacity: 0, duration: 0.01 }, sitAt);
          tl.to("#s7-wSeated", { opacity: 1, duration: 0.01 }, sitAt);
          gsap.set("#s7-wSeated", { svgOrigin: "1560 800" });
          tl.fromTo("#s7-wSeated", { y: -24 }, { y: 0, duration: 0.25, ease: "bounce.out", immediateRender: false }, sitAt);
          gsap.set("#s7-wTorso", { svgOrigin: "1560 668" });
          tl.fromTo("#s7-wTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, sitAt);

          // "the history is already there": his weeks open on the wall, bars rise, the rash week is tagged
          gsap.set("#s7-panel", { svgOrigin: "1100 295", scale: 0.92 });
          tl.to("#s7-panel", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, t(1) + 1.9);
          for (let i = 0; i < 7; i++) {
            tl.to("#s7-b" + i, { scaleY: 1, duration: 0.35, ease: "back.out(1.3)" }, t(1) + 2.3 + i * 0.12);
          }
          gsap.set("#s7-rashTag", { svgOrigin: "1285 256", scale: 0.6 });
          tl.to("#s7-rashTag", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t(1) + 3.3);

          // "and the follow-up questions write themselves": Dr. Shah's suggested question appears
          tl.fromTo("#s7-sugg", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t(1) + 3.8);
          gsap.set("#s7-bubble", { svgOrigin: "700 600", scale: 0.8 });
          tl.to("#s7-bubble", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, t(1) + 4.1);
          tl.fromTo("#s7-dHead", { y: 0 }, { y: -6, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(1) + 4.1);

          // Walter points to his arm, the rash shows; both smile
          const pt = t(1) + 5.0;
          tl.to("#s7-rArm", { opacity: 0, duration: 0.01 }, pt);
          tl.to("#s7-pArm", { opacity: 1, duration: 0.01 }, pt);
          tl.fromTo("#s7-pArm", { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, pt);
          tl.to("#s7-rash", { opacity: 1, duration: 0.3 }, pt + 0.3);
          const sm = pt + 0.7;
          tl.to(["#s7-wMouth", "#s7-dMouth"], { opacity: 0, duration: 0.12 }, sm);
          tl.to(["#s7-wSmile", "#s7-dSmile"], { opacity: 1, duration: 0.3 }, sm);

          window.__timelines["scene-7"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
