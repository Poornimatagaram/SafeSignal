<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #scene-8-root { position: absolute; inset: 0; overflow: hidden; font-family: "Montserrat", sans-serif; background: #e9eff4; }
        #scene-8-root * { margin: 0; padding: 0; box-sizing: border-box; }
        .s8-layer { position: absolute; inset: 0; }
        .s8-layer svg { width: 100%; height: 100%; display: block; }
        #s8-back { left: -400px; right: -400px; }
        #s8-fg { filter: blur(5px); }
        #s8-cover { background: #f6f8fa; }
        #s8-tag {
          position: absolute; left: 120px; top: 108px; display: flex; align-items: center; gap: 22px;
          padding: 22px 42px 22px 32px; background: #fff; border: 4px solid #13233a; border-radius: 22px;
          box-shadow: 8px 10px 0 rgba(19, 35, 58, 0.18);
        }
        #s8-tag .s8-dot { display: block; width: 26px; height: 26px; border-radius: 50%; background: #0e7c7b; }
        #s8-tag .s8-name { display: block; font-size: 60px; font-weight: 700; letter-spacing: -0.01em; color: #13233a; line-height: 1; }
      </style>
      <div id="scene-8-root" data-composition-id="scene-8" data-width="1920" data-height="1080">
        <div id="s8-cam" class="s8-layer">
          <div id="s8-back" class="s8-layer">
            <svg viewBox="-400 0 2720 1080" xmlns="http://www.w3.org/2000/svg">
              <rect x="-400" y="-400" width="2720" height="1200" fill="#fbf0cf" />
              <ellipse cx="760" cy="500" rx="700" ry="520" fill="#fff4cf" opacity="0.8" />
              <rect x="-400" y="800" width="2720" height="280" fill="#dde5ec" />
              <rect x="-400" y="792" width="2720" height="14" fill="#cfd8e3" />
              <ellipse cx="960" cy="880" rx="900" ry="40" fill="#13233a" opacity="0.10" />
              <!-- window, evening -->
              <rect x="1040" y="140" width="300" height="260" rx="10" fill="#cfd8e3" stroke="#13233a" stroke-width="6" />
              <rect x="1054" y="154" width="272" height="232" fill="#ffd9a0" />
              <line x1="1190" y1="154" x2="1190" y2="386" stroke="#13233a" stroke-width="6" />
              <line x1="1054" y1="270" x2="1326" y2="270" stroke="#13233a" stroke-width="6" />
              <!-- standing lamp -->
              <rect x="226" y="520" width="12" height="280" fill="#8c7650" stroke="#13233a" stroke-width="4" />
              <polygon points="170,520 294,520 270,430 194,430" fill="#fbf0cf" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
              <ellipse cx="232" cy="808" rx="60" ry="12" fill="#8c7650" stroke="#13233a" stroke-width="4" />
            </svg>
          </div>
          <div id="s8-mid" class="s8-layer">
            <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
              <!-- armchair back -->
              <rect x="590" y="300" width="340" height="470" rx="90" fill="#bfe0df" stroke="#13233a" stroke-width="6" />
              <g transform="translate(260 0)">
                <!-- Walter -->
                <g id="s8-wTorso">
                  <rect x="400" y="462" width="200" height="290" rx="64" fill="#0e7c7b" stroke="#13233a" stroke-width="6" />
                  <line x1="500" y1="504" x2="500" y2="740" stroke="#0a5e5d" stroke-width="5" />
                  <circle cx="518" cy="560" r="7" fill="#0a5e5d" />
                  <circle cx="518" cy="620" r="7" fill="#0a5e5d" />
                  <rect x="480" y="434" width="40" height="42" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                  <polygon points="466,456 500,508 534,456" fill="#ffffff" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                </g>
                <g id="s8-wHead">
                  <circle cx="500" cy="345" r="76" fill="#f2d6c0" stroke="#13233a" stroke-width="6" />
                  <path d="M426 330 Q420 270 470 262 Q500 254 530 262 Q580 270 574 330 Q556 302 536 308 Q518 292 500 306 Q482 292 464 308 Q444 302 426 330 Z" fill="#c9d2dc" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                  <circle cx="472" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                  <circle cx="528" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                  <line x1="494" y1="346" x2="506" y2="346" stroke="#13233a" stroke-width="4" />
                  <circle id="s8-wEyeL" cx="474" cy="348" r="5" fill="#13233a" />
                  <circle id="s8-wEyeR" cx="530" cy="348" r="5" fill="#13233a" />
                  <path d="M456 326 Q472 322 488 328 M512 328 Q528 322 544 326" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                  <path id="s8-mouthFlat" d="M486 388 Q500 384 514 388" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                  <path id="s8-mouthSmile" d="M476 380 Q500 408 524 380" stroke="#13233a" stroke-width="4.5" stroke-linecap="round" fill="none" />
                  <g id="s8-cheeks"><circle cx="458" cy="378" r="9" fill="#e9a08c" opacity="0.55" /><circle cx="542" cy="378" r="9" fill="#e9a08c" opacity="0.55" /></g>
                </g>
              </g>
              <!-- armchair seat and arms -->
              <rect x="570" y="690" width="380" height="110" rx="30" fill="#9fd0cf" stroke="#13233a" stroke-width="6" />
              <rect x="552" y="600" width="86" height="200" rx="34" fill="#bfe0df" stroke="#13233a" stroke-width="6" />
              <rect x="882" y="600" width="86" height="200" rx="34" fill="#bfe0df" stroke="#13233a" stroke-width="6" />
              <g transform="translate(260 0)">
                <!-- left arm resting on the chair arm -->
                <path d="M414 504 Q380 580 390 612" stroke="#13233a" stroke-width="50" stroke-linecap="round" fill="none" />
                <path d="M414 504 Q380 580 390 612" stroke="#0e7c7b" stroke-width="38" stroke-linecap="round" fill="none" />
                <circle cx="392" cy="616" r="22" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                <!-- right arm holds a cup of tea -->
                <g id="s8-cupArm">
                  <path d="M586 504 Q650 540 612 586" stroke="#13233a" stroke-width="50" stroke-linecap="round" fill="none" />
                  <path d="M586 504 Q650 540 612 586" stroke="#0e7c7b" stroke-width="38" stroke-linecap="round" fill="none" />
                  <path d="M588 566 H642 V600 Q642 626 615 626 Q588 626 588 600 Z" fill="#ffffff" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                  <path d="M642 574 Q662 576 660 594 Q658 608 640 606" fill="none" stroke="#13233a" stroke-width="5" stroke-linecap="round" />
                  <g id="s8-steam" fill="none" stroke="#9fb3c4" stroke-width="5" stroke-linecap="round">
                    <path d="M604 552 Q596 538 606 524 Q614 512 606 498" />
                    <path d="M626 552 Q618 540 628 528 Q636 516 628 504" />
                  </g>
                  <circle cx="614" cy="598" r="20" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                </g>
              </g>

              <!-- side table with the phone -->
              <rect x="1140" y="760" width="26" height="130" fill="#c8b184" stroke="#13233a" stroke-width="5" />
              <rect x="1424" y="760" width="26" height="130" fill="#c8b184" stroke="#13233a" stroke-width="5" />
              <rect x="1110" y="730" width="370" height="32" rx="8" fill="#d8c39a" stroke="#13233a" stroke-width="6" />
              <g id="s8-phone">
                <rect x="1200" y="440" width="190" height="290" rx="28" fill="#13233a" />
                <rect x="1210" y="452" width="170" height="266" rx="20" fill="#f6f8fa" />
                <text x="1295" y="496" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="28" fill="#4a5a70">Check-ins</text>
                <g id="s8-ticks"></g>
              </g>
              <!-- message from Anna -->
              <g id="s8-note">
                <polygon points="1422,570 1392,600 1422,624" fill="#ffffff" stroke="#13233a" stroke-width="6" stroke-linejoin="round" />
                <rect x="1420" y="500" width="440" height="170" rx="28" fill="#ffffff" stroke="#13233a" stroke-width="6" />
                <rect x="1416" y="582" width="10" height="36" fill="#ffffff" />
                <circle cx="1486" cy="585" r="38" fill="#fbf0cf" stroke="#13233a" stroke-width="5" />
                <circle cx="1486" cy="574" r="12" fill="#13233a" />
                <path d="M1464 604 Q1464 586 1486 586 Q1508 586 1508 604 Z" fill="#13233a" />
                <text x="1548" y="580" font-family="Montserrat, sans-serif" font-weight="700" font-size="32" fill="#13233a">Anna</text>
                <text x="1548" y="624" font-family="Montserrat, sans-serif" font-weight="600" font-size="28" fill="#4a5a70">Thinking of you</text>
              </g>
              <g id="s8-heart">
                <path d="M0 14 C-34 -14 -18 -40 0 -22 C18 -40 34 -14 0 14 Z" fill="#0e7c7b" stroke="#13233a" stroke-width="4" stroke-linejoin="round" />
              </g>
            </svg>
          </div>
        </div>
        <div id="s8-fg" class="s8-layer">
          <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <g fill="#0a5e5d">
              <path d="M-40 1100 C20 900 120 780 260 720 C240 840 180 980 90 1100 Z" />
              <path d="M40 1100 C140 960 280 900 420 900 C340 980 250 1060 190 1100 Z" opacity="0.92" />
              <path d="M-40 1100 C-30 960 -10 860 40 780 C100 880 110 1000 90 1100 Z" fill="#0e7c7b" />
            </g>
          </svg>
        </div>
        <div id="s8-cover" class="s8-layer"></div>
        <div id="s8-tag"><span class="s8-dot"></span><span class="s8-name">Looked after</span></div>
        <audio id="s8-narration" src="assets/audio/s8-narration.wav" data-start="0.4" data-track-index="1" data-volume="1"></audio>
      </div>
      <script>
        (function () {
          const L = 0.4; // matches data-start of #s8-narration
          const N = window.NARRATION_S8.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 3.6;
          if (L + window.NARRATION_S8.duration > SCENE_LEN) {
            console.warn("scene 8 narration is longer than the scene: raise its data-duration in index.html");
          }

          // a grid of check-in ticks on the phone: 3 columns, 4 rows
          const tg = document.getElementById("s8-ticks");
          const NS = "http://www.w3.org/2000/svg";
          for (let i = 0; i < 12; i++) {
            const cx = 1244 + (i % 3) * 52, cy = 548 + Math.floor(i / 3) * 48;
            const g = document.createElementNS(NS, "g");
            g.setAttribute("id", "s8-tick" + i);
            g.innerHTML = '<circle cx="' + cx + '" cy="' + cy + '" r="19" fill="#0e7c7b" stroke="#13233a" stroke-width="3" /><path d="M' + (cx - 8) + ' ' + (cy + 1) + ' L' + (cx - 2) + ' ' + (cy + 8) + ' L' + (cx + 9) + ' ' + (cy - 7) + '" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />';
            tg.appendChild(g);
          }

          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const tl = gsap.timeline({ paused: true });
          gsap.set("#s8-cam", { transformOrigin: "0 0", ...cam(960, 540, 1.0) });
          tl.to("#s8-cam", { ...cam(1020, 520, 1.05), duration: SCENE_LEN - 0.4, ease: "sine.inOut" }, 0.2);
          tl.fromTo("#s8-fg", { x: 0 }, { x: -30, duration: SCENE_LEN, ease: "none" }, 0);
          tl.fromTo("#s8-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // breathing, blinks, steam
          gsap.set("#s8-wTorso", { svgOrigin: "760 750" });
          tl.fromTo("#s8-wTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          gsap.set(["#s8-wEyeL", "#s8-wEyeR"], { svgOrigin: "760 348" });
          tl.to(["#s8-wEyeL", "#s8-wEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 1.7);
          gsap.set("#s8-wHead", { svgOrigin: "760 430" });
          tl.fromTo("#s8-steam", { y: 0, opacity: 0.9 }, { y: -10, opacity: 0.3, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

          // "Walter feels looked after.": the check-ins fill in, Anna's message arrives, he smiles and takes a sip
          for (let i = 0; i < 12; i++) {
            const cx = 1244 + (i % 3) * 52, cy = 548 + Math.floor(i / 3) * 48;
            gsap.set("#s8-tick" + i, { svgOrigin: cx + " " + cy, scale: 0, opacity: 0 });
            tl.to("#s8-tick" + i, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2.4)" }, 0.45 + i * 0.05);
          }
          gsap.set("#s8-note", { svgOrigin: "1392 600", scale: 0.4, opacity: 0 });
          tl.to("#s8-note", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, t(0) + 0.5);
          gsap.set("#s8-heart", { x: 1822, y: 520, scale: 0, opacity: 0 });
          tl.to("#s8-heart", { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, t(0) + 1.0);
          tl.to("#s8-heart", { y: 470, opacity: 0, duration: 0.7, ease: "power1.out" }, t(0) + 1.5);
          gsap.set(["#s8-mouthSmile", "#s8-cheeks"], { opacity: 0 });
          tl.to("#s8-mouthFlat", { opacity: 0, duration: 0.15 }, t(0) + 0.7);
          tl.to(["#s8-mouthSmile", "#s8-cheeks"], { opacity: 1, duration: 0.3 }, t(0) + 0.7);
          tl.fromTo("#s8-wHead", { y: 0 }, { y: -8, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(0) + 0.7);
          gsap.set("#s8-cupArm", { svgOrigin: "846 504" });
          tl.to("#s8-cupArm", { rotation: -10, y: -14, duration: 0.45, ease: "power2.inOut", yoyo: true, repeat: 1 }, t(0) + 1.5);

          tl.fromTo("#s8-tag", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.5)" }, t(0) + 0.1);

          window.__timelines["scene-8"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
