        (function () {

          const SCENE_LEN = 7.1;
          if (L + window.NARRATION_S9.duration > SCENE_LEN) {

          }

          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const tl = gsap.timeline({ paused: true });
          gsap.set("#s9-cam", { transformOrigin: "0 0", ...cam(960, 540, 1.0) });
          tl.to("#s9-cam", { ...cam(900, 540, 1.04), duration: t(1) - 0.2, ease: "sine.inOut" }, 0.2);
          tl.to("#s9-cam", { ...cam(1020, 540, 1.04), duration: SCENE_LEN - t(1) - 0.1, ease: "sine.inOut" }, t(1));
          tl.fromTo("#s9-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // the split
          gsap.set("#s9-divider", { svgOrigin: "960 540", scaleY: 0 });
          tl.to("#s9-divider", { scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.15);
          tl.fromTo("#s9-left", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.2);
          tl.fromTo("#s9-right", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.2);

          // breathing and blinks
          gsap.set("#s9-dTorso", { svgOrigin: "300 740" });
          tl.fromTo("#s9-dTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          gsap.set("#s9-lTorso", { svgOrigin: "1150 740" });
          tl.fromTo("#s9-lTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          gsap.set(["#s9-lEyeL", "#s9-lEyeR"], { svgOrigin: "1150 353" });
          tl.to(["#s9-lEyeL", "#s9-lEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 3.6);
          gsap.set(["#s9-dEyeL", "#s9-dEyeR"], { svgOrigin: "300 353" });

          gsap.set("#s9-lSmile", { opacity: 0 });

          // "His doctor has more time to guide him.": the left side is the bright one
          tl.set("#s9-dimR", { opacity: 0.5 }, 0.2);
          gsap.set("#s9-dimR", { opacity: 0 });
          tl.to("#s9-dimR", { opacity: 0.5, duration: 0.5 }, 0.2);
