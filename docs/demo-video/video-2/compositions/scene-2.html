<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #scene-2-root { position: absolute; inset: 0; overflow: hidden; font-family: "Montserrat", sans-serif; background: #e9eff4; }
        #scene-2-root * { margin: 0; padding: 0; box-sizing: border-box; }
        .s2-layer { position: absolute; inset: 0; }
        .s2-layer svg { width: 100%; height: 100%; display: block; }
        #s2-back { left: -400px; right: -400px; }
        #s2-cover { background: #f6f8fa; }
        #s2-tag {
          position: absolute; left: 120px; top: 108px; display: flex; align-items: center; gap: 22px;
          padding: 22px 42px 22px 32px; background: #fff; border: 4px solid #13233a; border-radius: 22px;
          box-shadow: 8px 10px 0 rgba(19, 35, 58, 0.18);
        }
        #s2-tag .s2-dot { display: block; width: 26px; height: 26px; border-radius: 50%; background: #0e7c7b; }
        #s2-tag .s2-name { display: block; font-size: 60px; font-weight: 700; letter-spacing: -0.01em; color: #13233a; line-height: 1; }
      </style>
      <div id="scene-2-root" data-composition-id="scene-2" data-width="1920" data-height="1080">
        <div id="s2-cam" class="s2-layer">
          <div id="s2-back" class="s2-layer">
            <svg viewBox="-400 0 2720 1080" xmlns="http://www.w3.org/2000/svg">

              <ellipse id="s2-spot" cx="1430" cy="520" rx="620" ry="520" fill="#fff4cf" opacity="0.75" />

              <ellipse cx="1430" cy="880" rx="480" ry="40" fill="#13233a" opacity="0.14" />
            </svg>
          </div>
          <div id="s2-mid" class="s2-layer">
            <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
              <!-- LEFT: Priya types (small, quiet) -->
              <g id="s2-left">
                <g transform="translate(470 800) scale(0.85) translate(-470 -800)">
                  <circle cx="470" cy="292" r="28" fill="#3a2a28" stroke="#13233a" stroke-width="5" />
                  <g id="s2-pTorso">
                    <rect x="390" y="470" width="160" height="240" rx="54" fill="#44597f" stroke="#13233a" stroke-width="6" />
                    <rect x="450" y="442" width="40" height="40" fill="#e8c4a6" stroke="#13233a" stroke-width="5" />
                    <path d="M440 466 Q470 500 500 466" fill="#f6f8fa" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                  </g>
                  <g id="s2-pHead">
                    <circle cx="470" cy="380" r="62" fill="#e8c4a6" stroke="#13233a" stroke-width="6" />
                    <path d="M406 374 Q404 306 470 300 Q536 306 534 374 Q520 340 470 338 Q420 340 406 374 Z" fill="#3a2a28" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                    <circle cx="448" cy="392" r="5" fill="#13233a" />
                    <circle cx="492" cy="392" r="5" fill="#13233a" />
                    <path d="M434 376 Q448 371 462 376 M478 376 Q492 371 506 376" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                    <path d="M456 418 Q470 428 484 418" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                  </g>
                  <!-- desk -->
                  <rect x="190" y="730" width="26" height="110" fill="#c8b184" stroke="#13233a" stroke-width="5" />
                  <rect x="724" y="730" width="26" height="110" fill="#c8b184" stroke="#13233a" stroke-width="5" />
                  <rect x="150" y="700" width="640" height="30" rx="8" fill="#d8c39a" stroke="#13233a" stroke-width="6" />
                  <!-- phone on the desk, text appearing -->
                  <rect x="420" y="556" width="100" height="144" rx="18" fill="#13233a" />
                  <rect x="429" y="566" width="82" height="124" rx="11" fill="#f6f8fa" />
                  <rect id="s2-line0" x="437" y="582" width="0" height="10" rx="5" fill="#13233a" />
                  <rect id="s2-line1" x="437" y="602" width="0" height="10" rx="5" fill="#13233a" />
                  <rect id="s2-line2" x="437" y="622" width="0" height="10" rx="5" fill="#13233a" />
                  <rect id="s2-cursor" x="437" y="582" width="4" height="14" fill="#0e7c7b" />
                  <g fill="#cfd8e3">
                    <rect x="437" y="650" width="14" height="10" rx="3" /><rect x="456" y="650" width="14" height="10" rx="3" /><rect x="475" y="650" width="14" height="10" rx="3" /><rect x="494" y="650" width="10" height="10" rx="3" />
                    <rect x="437" y="666" width="14" height="10" rx="3" /><rect x="456" y="666" width="14" height="10" rx="3" /><rect x="475" y="666" width="14" height="10" rx="3" /><rect x="494" y="666" width="10" height="10" rx="3" />
                  </g>
                  <!-- arms and thumbs -->
                  <path d="M404 506 Q372 600 426 668" stroke="#13233a" stroke-width="48" stroke-linecap="round" fill="none" />
                  <path d="M404 506 Q372 600 426 668" stroke="#44597f" stroke-width="36" stroke-linecap="round" fill="none" />
                  <path d="M536 506 Q568 600 514 668" stroke="#13233a" stroke-width="48" stroke-linecap="round" fill="none" />
                  <path d="M536 506 Q568 600 514 668" stroke="#44597f" stroke-width="36" stroke-linecap="round" fill="none" />
                  <circle id="s2-handL" cx="430" cy="670" r="20" fill="#e8c4a6" stroke="#13233a" stroke-width="5" />
                  <circle id="s2-handR" cx="510" cy="670" r="20" fill="#e8c4a6" stroke="#13233a" stroke-width="5" />
                </g>
              </g>
              <!-- dim the left half -->
              <rect id="s2-dim" x="-400" y="-100" width="1360" height="1300" fill="#dfe6ee" opacity="0.4" />
              <!-- label for the left half stays clear of the dimming -->
                <g id="s2-typeLbl">
                  <rect x="372" y="852" width="196" height="72" rx="20" fill="#ffffff" stroke="#13233a" stroke-width="5" />
                  <text x="470" y="902" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="40" fill="#13233a">Type</text>
                </g>
              <!-- divider -->
              <rect id="s2-divider" x="957" y="0" width="6" height="1080" fill="#13233a" opacity="0.5" />

              <!-- RIGHT: Walter speaks (larger, brighter) -->
              <g id="s2-right">
                <g transform="translate(1430 800) scale(1.2) translate(-500 -800)">
                  <!-- table -->
                  <rect x="340" y="728" width="300" height="140" fill="#c8b184" stroke="#13233a" stroke-width="5" />
                  <g id="s2-wTorso">
                    <rect x="400" y="462" width="200" height="290" rx="64" fill="#0e7c7b" stroke="#13233a" stroke-width="6" />
                    <line x1="500" y1="504" x2="500" y2="740" stroke="#0a5e5d" stroke-width="5" />
                    <circle cx="518" cy="560" r="7" fill="#0a5e5d" />
                    <circle cx="518" cy="620" r="7" fill="#0a5e5d" />
                    <rect x="480" y="434" width="40" height="42" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                    <polygon points="466,456 500,508 534,456" fill="#ffffff" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                  </g>
                  <g id="s2-wHead">
                    <circle cx="500" cy="345" r="76" fill="#f2d6c0" stroke="#13233a" stroke-width="6" />
                    <path d="M426 330 Q420 270 470 262 Q500 254 530 262 Q580 270 574 330 Q556 302 536 308 Q518 292 500 306 Q482 292 464 308 Q444 302 426 330 Z" fill="#c9d2dc" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                    <circle cx="472" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                    <circle cx="528" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                    <line x1="494" y1="346" x2="506" y2="346" stroke="#13233a" stroke-width="4" />
                    <circle id="s2-wEyeL" cx="474" cy="348" r="5" fill="#13233a" />
                    <circle id="s2-wEyeR" cx="530" cy="348" r="5" fill="#13233a" />
                    <path d="M456 326 Q472 322 488 328 M512 328 Q528 322 544 326" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                    <path id="s2-mouthFlat" d="M486 388 Q500 384 514 388" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                    <ellipse id="s2-mouthOpen" cx="500" cy="388" rx="11" ry="9" fill="#13233a" />
                  </g>
                  <!-- left arm resting -->
                  <path d="M414 504 Q392 600 440 688" stroke="#13233a" stroke-width="50" stroke-linecap="round" fill="none" />
                  <path d="M414 504 Q392 600 440 688" stroke="#0e7c7b" stroke-width="38" stroke-linecap="round" fill="none" />
                  <circle cx="444" cy="694" r="22" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                  <!-- sound waves between mouth and phone -->
                  <g id="s2-waves" fill="none" stroke="#0e7c7b" stroke-width="7" stroke-linecap="round">
                    <path id="s2-wave0" d="M562 366 Q574 388 562 410" />
                    <path id="s2-wave1" d="M582 350 Q602 388 582 426" />
                    <path id="s2-wave2" d="M602 334 Q630 388 602 442" />
                  </g>
                  <!-- right arm holds the phone -->
                  <g id="s2-phoneArm">
                    <path d="M586 504 Q660 560 656 478" stroke="#13233a" stroke-width="50" stroke-linecap="round" fill="none" />
                    <path d="M586 504 Q660 560 656 478" stroke="#0e7c7b" stroke-width="38" stroke-linecap="round" fill="none" />
                    <rect x="650" y="314" width="110" height="176" rx="22" fill="#13233a" />
                    <rect x="659" y="324" width="92" height="156" rx="14" fill="#f6f8fa" />
                    <circle id="s2-mic" cx="705" cy="402" r="30" fill="#0e7c7b" />
                    <rect x="697" y="386" width="16" height="26" rx="8" fill="#ffffff" />
                    <path d="M690 404 Q690 424 705 424 Q720 424 720 404" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
                    <circle cx="660" cy="480" r="22" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                  </g>
                </g>
                <g id="s2-speakLbl">
                  <rect x="1312" y="852" width="236" height="84" rx="22" fill="#ffffff" stroke="#13233a" stroke-width="5" />
                  <text x="1430" y="908" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="46" fill="#0e7c7b">Speak</text>
                </g>
              </g>
            </svg>
          </div>
        </div>
        <div id="s2-cover" class="s2-layer"></div>
        <div id="s2-tag"><span class="s2-dot"></span><span class="s2-name">Type or speak</span></div>
        <audio id="s2-narration" src="assets/audio/s2-narration.wav" data-start="0.4" data-track-index="1" data-volume="1"></audio>
      </div>
      <script>
        (function () {
          const L = 0.4; // matches data-start of #s2-narration
          const N = window.NARRATION_S2.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 4.4;
          if (L + window.NARRATION_S2.duration > SCENE_LEN) {
            console.warn("scene 2 narration is longer than the scene: raise its data-duration in index.html");
          }

          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const tl = gsap.timeline({ paused: true });
          gsap.set("#s2-cam", { transformOrigin: "0 0", ...cam(960, 540, 1.0) });
          // the camera drifts toward Walter once he starts to talk
          tl.to("#s2-cam", { ...cam(1000, 530, 1.02), duration: t(1) - 0.2, ease: "sine.inOut" }, 0.2);
          tl.to("#s2-cam", { ...cam(1090, 520, 1.08), duration: SCENE_LEN - t(1) - 0.1, ease: "sine.inOut" }, t(1));
          tl.fromTo("#s2-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // the screen splits
          gsap.set("#s2-divider", { svgOrigin: "960 540", scaleY: 0 });
          tl.to("#s2-divider", { scaleY: 1, duration: 0.5, ease: "power2.out" }, 0.15);
          tl.fromTo("#s2-left", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.2);
          tl.fromTo("#s2-right", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.2);

          // breathing and blinks
          gsap.set("#s2-wTorso", { svgOrigin: "1430 740" });
          tl.fromTo("#s2-wTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
          gsap.set(["#s2-wEyeL", "#s2-wEyeR"], { svgOrigin: "1430 312" });
          tl.to(["#s2-wEyeL", "#s2-wEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 2.0);
          gsap.set("#s2-pTorso", { svgOrigin: "470 780" });
          tl.fromTo("#s2-pTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);

          // "Some people type.": Priya types, small and quiet
          tl.fromTo("#s2-typeLbl", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, t(0) + 0.1);
          tl.to("#s2-line0", { attr: { width: 58 }, duration: 0.6, ease: "steps(8)" }, t(0) + 0.05);
          tl.to("#s2-line1", { attr: { width: 46 }, duration: 0.5, ease: "steps(7)" }, t(0) + 0.6);
          tl.to("#s2-line2", { attr: { width: 52 }, duration: 0.5, ease: "steps(7)" }, t(0) + 1.1);
          tl.fromTo("#s2-cursor", { attr: { y: 582 } }, { attr: { y: 622 }, duration: 1.4, ease: "steps(3)" }, t(0) + 0.05);
          tl.fromTo("#s2-handL", { y: 0 }, { y: -5, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 11 }, t(0));
          tl.fromTo("#s2-handR", { y: -5 }, { y: 0, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 11 }, t(0));

          // "Walter just talks.": he taps Speak, lifts the phone and talks; Priya fades further back
          gsap.set("#s2-phoneArm", { svgOrigin: "1533 445", rotation: 46 });
          gsap.set("#s2-waves path", { opacity: 0 });
          gsap.set("#s2-mouthOpen", { opacity: 0 });
          gsap.set("#s2-mic", { svgOrigin: "1500 302", scale: 1 });
          tl.fromTo("#s2-speakLbl", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, t(1) - 0.15);
          tl.to("#s2-dim", { opacity: 0.62, duration: 0.8, ease: "power1.inOut" }, t(1));
          tl.to("#s2-mic", { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t(1) + 0.05);
          tl.to("#s2-phoneArm", { rotation: 0, duration: 0.5, ease: "power2.out" }, t(1) + 0.2);
          tl.to("#s2-mouthFlat", { opacity: 0, duration: 0.05 }, t(1) + 0.55);
          tl.to("#s2-mouthOpen", { opacity: 1, duration: 0.05 }, t(1) + 0.55);
          gsap.set("#s2-mouthOpen", { svgOrigin: "1430 302" });
          tl.fromTo("#s2-mouthOpen", { scaleY: 1 }, { scaleY: 0.35, duration: 0.14, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, t(1) + 0.6);
          ["#s2-wave0", "#s2-wave1", "#s2-wave2"].forEach((id, k) => {
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.18, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, t(1) + 0.6 + k * 0.1);
          });

          tl.fromTo("#s2-tag", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.5)" }, t(0) + 0.05);

          window.__timelines["scene-2"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
