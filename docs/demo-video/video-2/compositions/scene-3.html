<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #scene-3-root { position: absolute; inset: 0; overflow: hidden; font-family: "Montserrat", sans-serif; background: #e9eff4; }
        #scene-3-root * { margin: 0; padding: 0; box-sizing: border-box; }
        .s3-layer { position: absolute; inset: 0; }
        .s3-layer svg { width: 100%; height: 100%; display: block; }
        #s3-back { left: -400px; right: -400px; }
        #s3-cover { background: #f6f8fa; }
      </style>
      <div id="scene-3-root" data-composition-id="scene-3" data-width="1920" data-height="1080">
        <div id="s3-cam" class="s3-layer">
          <div id="s3-back" class="s3-layer">
            <svg viewBox="-400 0 2720 1080" xmlns="http://www.w3.org/2000/svg">
              <rect x="-400" y="-400" width="2720" height="1200" fill="#fbf0cf" />
              <ellipse cx="1440" cy="520" rx="640" ry="520" fill="#fff4cf" opacity="0.75" />
              <rect x="-400" y="800" width="2720" height="280" fill="#dde5ec" />
              <rect x="-400" y="792" width="2720" height="14" fill="#cfd8e3" />
              <ellipse cx="480" cy="880" rx="420" ry="38" fill="#13233a" opacity="0.13" />
            </svg>
          </div>
          <div id="s3-mid" class="s3-layer">
            <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <clipPath id="s3-clip0"><rect id="s3-clipR0" x="1236" y="470" width="0" height="50" /></clipPath>
                <clipPath id="s3-clip1"><rect id="s3-clipR1" x="1236" y="518" width="0" height="50" /></clipPath>
                <clipPath id="s3-clip2"><rect id="s3-clipR2" x="1236" y="566" width="0" height="50" /></clipPath>
                <clipPath id="s3-clip3"><rect id="s3-clipR3" x="1236" y="614" width="0" height="50" /></clipPath>
              </defs>
              <!-- LEFT: Walter, seated, speaking -->
              <g id="s3-walter">
                <g transform="translate(480 800) scale(1.15) translate(-500 -800)">
                  <rect x="340" y="728" width="300" height="140" fill="#c8b184" stroke="#13233a" stroke-width="5" />
                  <g id="s3-wTorso">
                    <rect x="400" y="462" width="200" height="290" rx="64" fill="#0e7c7b" stroke="#13233a" stroke-width="6" />
                    <line x1="500" y1="504" x2="500" y2="740" stroke="#0a5e5d" stroke-width="5" />
                    <circle cx="518" cy="560" r="7" fill="#0a5e5d" />
                    <circle cx="518" cy="620" r="7" fill="#0a5e5d" />
                    <rect x="480" y="434" width="40" height="42" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                    <polygon points="466,456 500,508 534,456" fill="#ffffff" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                  </g>
                  <g id="s3-wHead">
                    <circle cx="500" cy="345" r="76" fill="#f2d6c0" stroke="#13233a" stroke-width="6" />
                    <path d="M426 330 Q420 270 470 262 Q500 254 530 262 Q580 270 574 330 Q556 302 536 308 Q518 292 500 306 Q482 292 464 308 Q444 302 426 330 Z" fill="#c9d2dc" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                    <circle cx="472" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                    <circle cx="528" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                    <line x1="494" y1="346" x2="506" y2="346" stroke="#13233a" stroke-width="4" />
                    <circle id="s3-wEyeL" cx="474" cy="348" r="5" fill="#13233a" />
                    <circle id="s3-wEyeR" cx="530" cy="348" r="5" fill="#13233a" />
                    <path d="M456 326 Q472 322 488 328 M512 328 Q528 322 544 326" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                    <path id="s3-mouthFlat" d="M486 388 Q500 384 514 388" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                    <ellipse id="s3-mouthOpen" cx="500" cy="388" rx="11" ry="9" fill="#13233a" />
                  </g>
                  <!-- arms resting -->
                  <path d="M414 504 Q392 600 440 688" stroke="#13233a" stroke-width="50" stroke-linecap="round" fill="none" />
                  <path d="M414 504 Q392 600 440 688" stroke="#0e7c7b" stroke-width="38" stroke-linecap="round" fill="none" />
                  <circle cx="444" cy="694" r="22" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                  <path d="M586 504 Q608 600 560 688" stroke="#13233a" stroke-width="50" stroke-linecap="round" fill="none" />
                  <path d="M586 504 Q608 600 560 688" stroke="#0e7c7b" stroke-width="38" stroke-linecap="round" fill="none" />
                  <circle cx="556" cy="694" r="22" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                </g>
              </g>

              <!-- soft waveform from his voice towards the phone -->
              <g id="s3-wave" fill="#0e7c7b">
                <rect class="s3-bar" x="640" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="684" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="728" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="772" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="816" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="860" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="904" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="948" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="992" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="1036" y="300" width="16" height="60" rx="8" />
                <rect class="s3-bar" x="1080" y="300" width="16" height="60" rx="8" />
              </g>

              <!-- RIGHT: his phone, large -->
              <g id="s3-phoneWrap">
                <ellipse cx="1440" cy="960" rx="300" ry="26" fill="#13233a" opacity="0.14" />
                <rect id="s3-outline" x="1156" y="146" width="568" height="812" rx="72" fill="none" stroke="#0e7c7b" stroke-width="6" stroke-dasharray="16 14" opacity="0" />
                <rect x="1180" y="170" width="520" height="770" rx="56" fill="#13233a" />
                <rect x="1194" y="184" width="492" height="742" rx="44" fill="#f6f8fa" />
                <text x="1440" y="248" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="30" fill="#4a5a70">Daily check-in</text>
                <!-- question card -->
                <g id="s3-q">
                  <rect x="1220" y="276" width="440" height="148" rx="26" fill="#0e7c7b" />
                  <text x="1250" y="338" font-family="Montserrat, sans-serif" font-weight="700" font-size="32" fill="#ffffff">Have you noticed any</text>
                  <text x="1250" y="386" font-family="Montserrat, sans-serif" font-weight="700" font-size="32" fill="#ffffff">new symptoms?</text>
                </g>
                <!-- transcript -->
                <rect x="1220" y="446" width="440" height="244" rx="22" fill="#ffffff" stroke="#cfd8e3" stroke-width="4" />
                <g font-family="Montserrat, sans-serif" font-weight="600" font-size="30" fill="#13233a">
                  <g clip-path="url(#s3-clip0)"><text x="1244" y="506">A rash on my arm since</text></g>
                  <g clip-path="url(#s3-clip1)"><text x="1244" y="554">Tuesday. My daughter</text></g>
                  <g clip-path="url(#s3-clip2)"><text x="1244" y="602">Anna drove me to</text></g>
                  <g clip-path="url(#s3-clip3)"><text x="1244" y="650">Oakfield to see it.</text></g>
                </g>
                <rect id="s3-caret" x="1244" y="472" width="4" height="34" fill="#0e7c7b" opacity="0" />
                <!-- lock chip -->
                <g id="s3-lockChip">
                  <rect x="1220" y="724" width="440" height="112" rx="26" fill="#fbf0cf" stroke="#13233a" stroke-width="5" />
                  <g id="s3-lock">
                    <path id="s3-shackle" d="M1262 770 V756 Q1262 738 1280 738 Q1298 738 1298 756 V770" fill="none" stroke="#13233a" stroke-width="7" stroke-linecap="round" />
                    <rect x="1248" y="768" width="64" height="48" rx="10" fill="#0e7c7b" stroke="#13233a" stroke-width="5" />
                    <circle cx="1280" cy="790" r="6" fill="#ffffff" />
                  </g>
                  <text x="1340" y="790" font-family="Montserrat, sans-serif" font-weight="700" font-size="30" fill="#13233a">Stays on</text>
                  <text x="1340" y="826" font-family="Montserrat, sans-serif" font-weight="700" font-size="30" fill="#13233a">this phone</text>
                </g>
              </g>
            </svg>
          </div>
        </div>
        <div id="s3-cover" class="s3-layer"></div>
        <audio id="s3-narration" src="assets/audio/s3-narration.wav" data-start="0.4" data-track-index="1" data-volume="1"></audio>
      </div>
      <script>
        (function () {
          const L = 0.4; // matches data-start of #s3-narration
          const N = window.NARRATION_S3.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 9.2;
          if (L + window.NARRATION_S3.duration > SCENE_LEN) {
            console.warn("scene 3 narration is longer than the scene: raise its data-duration in index.html");
          }

          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const tl = gsap.timeline({ paused: true });
          gsap.set("#s3-cam", { transformOrigin: "0 0", ...cam(960, 540, 1.0) });
          tl.to("#s3-cam", { ...cam(1040, 530, 1.03), duration: t(2) - 0.2, ease: "sine.inOut" }, 0.2);
          tl.to("#s3-cam", { ...cam(1120, 520, 1.06), duration: SCENE_LEN - t(2) - 0.1, ease: "sine.inOut" }, t(2));
          tl.fromTo("#s3-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // breathing and blinks
          gsap.set("#s3-wTorso", { svgOrigin: "480 743" });
          tl.fromTo("#s3-wTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
          gsap.set(["#s3-wEyeL", "#s3-wEyeR"], { svgOrigin: "480 280" });
          tl.to(["#s3-wEyeL", "#s3-wEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 1.9);
          tl.to(["#s3-wEyeL", "#s3-wEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 6.4);

          // "The questions are simple.": the phone comes in with the first question
          gsap.set("#s3-walter", { x: -40, opacity: 0 });
          tl.to("#s3-walter", { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
          gsap.set("#s3-phoneWrap", { svgOrigin: "1440 560", scale: 0.9, opacity: 0 });
          tl.to("#s3-phoneWrap", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.25);
          gsap.set("#s3-q", { svgOrigin: "1440 350", scale: 0.8, opacity: 0 });
          tl.to("#s3-q", { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" }, t(0) + 0.2);

          // "He answers in his own words.": he speaks, the waveform moves, his words appear as the transcript
          gsap.set("#s3-mouthOpen", { svgOrigin: "480 323", opacity: 0 });
          gsap.set("#s3-wave", { opacity: 0 });
          const speakStart = t(1) + 0.05, speakEnd = t(2) + 1.2;
          tl.to("#s3-wave", { opacity: 0.85, duration: 0.3 }, speakStart);
          tl.to("#s3-wave", { opacity: 0, duration: 0.5 }, speakEnd);
          tl.to("#s3-mouthFlat", { opacity: 0, duration: 0.05 }, speakStart);
          tl.to("#s3-mouthOpen", { opacity: 1, duration: 0.05 }, speakStart);
          tl.fromTo("#s3-mouthOpen", { scaleY: 1 }, { scaleY: 0.35, duration: 0.15, yoyo: true, repeat: Math.round((speakEnd - speakStart) / 0.15) - 1, ease: "sine.inOut", immediateRender: false }, speakStart);
          tl.to("#s3-mouthOpen", { opacity: 0, duration: 0.05 }, speakEnd);
          tl.to("#s3-mouthFlat", { opacity: 1, duration: 0.05 }, speakEnd);
          const bars = document.querySelectorAll("#s3-wave .s3-bar");
          const heights = [0.5, 0.9, 1.5, 1.0, 1.9, 1.2, 1.7, 0.8, 1.3, 0.7, 0.4];
          bars.forEach((b, i) => {
            gsap.set(b, { svgOrigin: (648 + i * 44) + " 330", scaleY: 0.3 });
            tl.to(b, { scaleY: heights[i], duration: 0.22 + (i % 3) * 0.05, ease: "sine.inOut", yoyo: true, repeat: Math.round((speakEnd - speakStart) / 0.28), }, speakStart + i * 0.04);
          });
          // transcript lines reveal left to right
          const lineW = [400, 396, 330, 360];
          const tStart = t(1) + 0.15, tEnd = t(2) + 0.9, per = (tEnd - tStart) / 4;
          gsap.set("#s3-caret", { opacity: 0 });
          tl.set("#s3-caret", { opacity: 1 }, tStart);
          lineW.forEach((w, i) => {
            tl.to("#s3-clipR" + i, { attr: { width: w }, duration: per * 0.9, ease: "none" }, tStart + i * per);
          });
          tl.fromTo("#s3-caret", { attr: { x: 1244, y: 472 } }, { attr: { x: 1244 + 400, y: 472 }, duration: per * 0.9, ease: "none", immediateRender: false }, tStart);
          tl.set("#s3-caret", { attr: { x: 1244, y: 520 } }, tStart + per);
          tl.to("#s3-caret", { attr: { x: 1244 + 396 }, duration: per * 0.9, ease: "none" }, tStart + per);
          tl.set("#s3-caret", { attr: { x: 1244, y: 568 } }, tStart + 2 * per);
          tl.to("#s3-caret", { attr: { x: 1244 + 330 }, duration: per * 0.9, ease: "none" }, tStart + 2 * per);
          tl.set("#s3-caret", { attr: { x: 1244, y: 616 } }, tStart + 3 * per);
          tl.to("#s3-caret", { attr: { x: 1244 + 360 }, duration: per * 0.9, ease: "none" }, tStart + 3 * per);
          tl.to("#s3-caret", { opacity: 0, duration: 0.2 }, tEnd + 0.1);

          // "...right on his phone, and only there.": the padlock closes and the phone is outlined
          gsap.set("#s3-lockChip", { opacity: 0, y: 24 });
          tl.to("#s3-lockChip", { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, t(2) + 0.5);
          gsap.set("#s3-shackle", { y: -12 });
          tl.to("#s3-shackle", { y: 0, duration: 0.3, ease: "bounce.out" }, t(2) + 0.85);
          gsap.set("#s3-lock", { svgOrigin: "1280 790" });
          tl.fromTo("#s3-lock", { scale: 1 }, { scale: 1.2, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t(2) + 1.1);
          tl.to("#s3-outline", { opacity: 0.9, duration: 0.5 }, t(2) + 1.5);
          gsap.set("#s3-outline", { svgOrigin: "1440 552" });
          tl.fromTo("#s3-outline", { scale: 1.03 }, { scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, t(2) + 1.5);

          window.__timelines["scene-3"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
