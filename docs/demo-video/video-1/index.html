<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SafeSignal Video 1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Narration cue times, one file per scene (written by docs/demo-video/tools/narrate.py). -->
    <script src="assets/audio/s1-narration.cues.js"></script>
    <script src="assets/audio/s2-narration.cues.js"></script>
    <script src="assets/audio/s3-narration.cues.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e9eff4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Scene lengths follow the narration: scene 1 is 6.0 s, scene 2 is 10.2 s, scene 3 is 12.7 s. Total 28.9 s so far. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.9" data-width="1920" data-height="1080">
      <div id="scene-1-host" data-composition-id="scene-1" data-composition-src="compositions/scene-1.html" data-start="0" data-duration="6" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-2-host" data-composition-id="scene-2" data-composition-src="compositions/scene-2.html" data-start="6" data-duration="10.2" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-3-host" data-composition-id="scene-3" data-composition-src="compositions/scene-3.html" data-start="16.2" data-duration="12.7" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
