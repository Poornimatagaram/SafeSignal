      <script>
        (function () {
          // Beats are placed from the narration's sentence times (tools/narrate.py), so a new voice or pace re-times them.
          const L = 0.4; // matches data-start of #s2-narration
          const N = window.NARRATION_S2.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const rashAt = t(0) + 0.5 * (e(0) - t(0));      // "and a rash is spreading"
          const lockAt = t(2) + 0.72 * (e(2) - t(2));     // "sent anywhere": the padlock shuts
          const SCENE_LEN = 10.2;
          if (L + window.NARRATION_S2.duration > SCENE_LEN) {
            console.warn("scene 2 narration is longer than the scene: raise its data-duration in index.html");
          }

          // camera: top-left origin, so x = 960 - s * Px and y = 540 - s * Py centres the point (Px, Py)
          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const WIDE = cam(900, 560, 1.05), ARM = cam(765, 650, 2.6), FORM = cam(1000, 660, 1.9),
            BUBBLE = cam(930, 360, 1.2), ROOM = cam(1000, 540, 1.0);

          const tl = gsap.timeline({ paused: true });
          gsap.set("#s2-cam", { transformOrigin: "0 0", ...WIDE });
          tl.to("#s2-cam", { ...ARM, duration: 1.0, ease: "power2.inOut" }, rashAt - 0.55);
          tl.to("#s2-cam", { ...FORM, duration: 0.9, ease: "power2.inOut" }, t(1) - 0.3);
          tl.to("#s2-cam", { ...BUBBLE, duration: 0.9, ease: "power2.inOut" }, t(2) - 0.3);
          tl.to("#s2-cam", { ...ROOM, duration: 1.3, ease: "power2.inOut" }, t(3) - 0.1);
          tl.fromTo("#s2-fg", { x: 0 }, { x: -50, duration: 10.2, ease: "none" }, 0);

          // light
          tl.fromTo("#s2-beam", { opacity: 0.12 }, { opacity: 0.2, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          // breathing, sway, a blink
          gsap.set("#s2-torso", { svgOrigin: "820 740" });
          tl.fromTo("#s2-torso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
          gsap.set("#s2-head", { svgOrigin: "820 430" });
          tl.fromTo("#s2-head", { rotation: -1 }, { rotation: 1.2, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
          gsap.set(["#s2-eyeL", "#s2-eyeR"], { svgOrigin: "820 348" });
          tl.to(["#s2-eyeL", "#s2-eyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 5.4);

          // hands tremble the whole scene
          gsap.set("#s2-handL", { svgOrigin: "746 626" });
          gsap.set("#s2-handR", { svgOrigin: "1030 660" });
          tl.fromTo("#s2-handL", { rotation: -4 }, { rotation: 4, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 109 }, 0.2);
          tl.fromTo("#s2-handR", { rotation: 3.5 }, { rotation: -3.5, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 85 }, 0.25);

          // steam
          gsap.set(["#s2-steam1", "#s2-steam2"], { svgOrigin: "1130 620" });
          ["#s2-steam1", "#s2-steam2"].forEach((id, i) => {
            tl.fromTo(id, { y: 10, opacity: 0 }, { y: -26, opacity: 0.85, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0.2 + i * 0.3);
          });

          // 1. the rash spreads over the wrist, dot by dot
          gsap.set(".s2-rashdot", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" });
          document.querySelectorAll(".s2-rashdot").forEach((dot, i) => {
            tl.to(dot, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, rashAt + 0.45 + i * 0.14);
          });

          // 2. the form slides in; the hand scribbles
          gsap.set("#s2-paper", { opacity: 0, x: 260 });
          tl.to("#s2-paper", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, t(1) - 0.2);
          const scribble = document.getElementById("s2-scribble");
          const len = scribble.getTotalLength();
          gsap.set(scribble, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(scribble, { strokeDashoffset: 0, duration: 0.8, ease: "none" }, t(1) + 0.25);

          // 3. the speech bubble, then the padlock shuts over it
          gsap.set("#s2-bubble", { svgOrigin: "880 296", scale: 0, opacity: 0 });
          tl.to("#s2-bubble", { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, t(2) + 0.05);
          ["#s2-dot1", "#s2-dot2", "#s2-dot3"].forEach((id, i) => {
            gsap.set(id, { svgOrigin: `${982 + i * 48} 230` });
            tl.fromTo(id, { scale: 1 }, { scale: 1.45, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, t(2) + 0.5 + i * 0.12);
          });
          gsap.set("#s2-lock", { svgOrigin: "1140 294", scale: 0, opacity: 0 });
          gsap.set("#s2-shackle", { y: -16 });
          tl.to("#s2-lock", { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, lockAt - 0.4);
          tl.to("#s2-shackle", { y: 0, duration: 0.16, ease: "power4.in" }, lockAt);
          tl.fromTo("#s2-lock", { rotation: -6 }, { rotation: 0, duration: 0.3, ease: "elastic.out(1.4, 0.4)", immediateRender: false }, lockAt + 0.16);

          // 4. he says nothing: the dots stop, the form is pushed away, the calendar flips to months away
          tl.to("#s2-dots", { opacity: 0, duration: 0.3 }, t(3));
          tl.to("#s2-paper", { x: 280, rotation: 7, opacity: 0, duration: 0.9, ease: "power2.in", svgOrigin: "1000 670" }, t(3) + 0.05);
          tl.fromTo("#s2-tag", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.5)" }, t(3) + 0.3);
          ["#s2-page1", "#s2-page2", "#s2-page3"].forEach((id, i) => {
            gsap.set(id, { svgOrigin: "1290 270" });
            tl.to(id, { scaleY: 0, duration: 0.24, ease: "power2.in" }, t(3) + 0.5 + i * 0.3);
