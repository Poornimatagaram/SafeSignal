      <script>
        (function () {
          const L = 0.4; // matches data-start of #s5-narration
          const N = window.NARRATION_S5.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 5.9;
          if (L + window.NARRATION_S5.duration > SCENE_LEN) {
            console.warn("scene 5 narration is longer than the scene: raise its data-duration in index.html");
          }
          const span = e(0) - t(0);
          const at = (f) => t(0) + f * span; // fraction of the sentence

          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const tl = gsap.timeline({ paused: true });
          gsap.set("#s5-cam", { transformOrigin: "0 0", ...cam(960, 540, 1.0) });
          tl.to("#s5-cam", { ...cam(1000, 480, 1.12), duration: SCENE_LEN - 0.4, ease: "sine.inOut" }, 0.2);
          tl.fromTo("#s5-fg", { x: 0 }, { x: -40, duration: SCENE_LEN, ease: "none" }, 0);
          tl.fromTo("#s5-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // mood lifts: the cool wall warms to butter, the sun comes up
          gsap.set("#s5-warm", { opacity: 0 });
          tl.to("#s5-warm", { opacity: 1, duration: 1.6, ease: "power1.inOut" }, at(0.25));
          gsap.set("#s5-sun", { svgOrigin: "300 180", scale: 0.6, opacity: 0 });
          tl.to("#s5-sun", { scale: 1.1, opacity: 0.85, duration: 1.8, ease: "power1.out" }, at(0.3));

          // breathing and blinks
          gsap.set("#s5-wTorso", { svgOrigin: "500 750" });
          tl.fromTo("#s5-wTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          gsap.set(["#s5-wEyeL", "#s5-wEyeR"], { svgOrigin: "500 348" });
          tl.to(["#s5-wEyeL", "#s5-wEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 2.3);
          gsap.set("#s5-wHead", { svgOrigin: "500 430" });
          tl.fromTo("#s5-wHead", { rotation: -1 }, { rotation: 1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          // "What if someone simply checked in": the calendar comes up
          gsap.set("#s5-cal", { svgOrigin: "1395 415", scale: 0.85, opacity: 0 });
          tl.to("#s5-cal", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, t(0) + 0.15);

          // "every day": one tick per day, quick and even
          const TICKS = 28;
          const tickStart = at(0.36), tickGap = (span * 0.36) / TICKS;
          for (let i = 0; i < TICKS; i++) {
            const cx = 1125 + (i % 7) * 90, cy = 330 + Math.floor(i / 7) * 82;
            gsap.set("#s5-tick" + i, { svgOrigin: cx + " " + cy, scale: 0, opacity: 0 });
            tl.to("#s5-tick" + i, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.4)" }, tickStart + i * tickGap);
          }

          // "at a time Walter chooses": the phone is raised with his time on it, and he smiles
          gsap.set("#s5-phoneArm", { y: 60, opacity: 0 });
          tl.to("#s5-phoneArm", { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, at(0.62));
          gsap.set("#s5-bell", { svgOrigin: "782 610", scale: 0 });
          tl.to("#s5-bell", { scale: 1, duration: 0.4, ease: "back.out(2)" }, at(0.78));
          gsap.set(["#s5-mouthSmile", "#s5-cheeks"], { opacity: 0 });
