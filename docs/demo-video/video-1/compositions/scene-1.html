<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        :root { --font: "Montserrat", sans-serif; }
        #scene-1-root { position: absolute; inset: 0; overflow: hidden; font-family: var(--font); background: #e9eff4; }
        #scene-1-root * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Clinical Mist (docs/design/company-web-ui.md) plus warm morning light for the kitchen. */
      :root {
        --ink: #13233a;
        --teal: #0e7c7b;
        --teal-deep: #0a5e5d;
        --porcelain: #f6f8fa;
        --wall: #e9eff4;
        --floor: #dde5ec;
        --line: #cfd8e3;
        --butter: #fbf0cf;
        --sun: #ffe9a8;
        --skin: #f2d6c0;
        --wood: #d8c39a;
        --wood-deep: #b79f70;
        --amber: #e0a33a;
        --font: "Montserrat", sans-serif;
      }
      
      
      
      .s1-layer {
        position: absolute;
        inset: 0;
      }
      .s1-layer svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #s1-back {
        left: -400px;
        right: -400px;
      }
      #s1-fg {
        filter: blur(5px);
      }
      #s1-motes i {
        position: absolute;
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff7dc;
      }
      #s1-cover {
        background: var(--porcelain);
      }
      #s1-tag {
        position: absolute;
        left: 120px;
        top: 108px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 22px 42px 22px 32px;
        background: #fff;
        border: 4px solid var(--ink);
        border-radius: 22px;
        box-shadow: 8px 10px 0 rgba(19, 35, 58, 0.18);
      }
      #s1-tag .s1-dot {
        display: block;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--teal);
      }
      #s1-tag .s1-name {
        display: block;
        font-size: 60px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
        line-height: 1;
      }
    
      </style>
      <div id="scene-1-root" data-composition-id="scene-1" data-width="1920" data-height="1080">

        <div id="s1-cam" class="s1-layer">

              <rect x="-400" y="792" width="2720" height="14" fill="#cfd8e3" />

              <!-- window -->

              <rect x="1428" y="540" width="404" height="22" rx="4" fill="#cfd8e3" stroke="#13233a" stroke-width="6" />
              <!-- shelf with a small plant, far wall -->

              <path d="M300 470 L292 418 L348 418 L340 470 Z" fill="#fff" stroke="#13233a" stroke-width="5" />
              <path d="M320 418 C300 380 290 360 296 330 M320 418 C324 376 336 352 352 332 M320 418 C340 398 366 392 384 396" stroke="#0e7c7b" stroke-width="8" stroke-linecap="round" fill="none" />

              <!-- torso -->

                <rect x="715" y="438" width="210" height="300" rx="64" fill="#0e7c7b" stroke="#13233a" stroke-width="6" />
                <line x1="820" y1="492" x2="820" y2="720" stroke="#0a5e5d" stroke-width="5" />
                <circle cx="838" cy="540" r="7" fill="#0a5e5d" />
                <circle cx="838" cy="600" r="7" fill="#0a5e5d" />
                <circle cx="838" cy="660" r="7" fill="#0a5e5d" />
                <rect x="800" y="412" width="40" height="44" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
                <polygon points="786,440 820,494 854,440" fill="#fff" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
              </g>
              <!-- head -->
              <g id="s1-head">
                <circle cx="820" cy="345" r="76" fill="#f2d6c0" stroke="#13233a" stroke-width="6" />
                <path d="M746 330 Q740 270 790 262 Q820 254 850 262 Q900 270 894 330 Q876 302 856 308 Q838 292 820 306 Q802 292 784 308 Q764 302 746 330 Z" fill="#c9d2dc" stroke="#13233a" stroke-width="5" stroke-linejoin="round" />
                <circle cx="792" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                <circle cx="848" cy="346" r="22" fill="#ffffff" fill-opacity="0.45" stroke="#13233a" stroke-width="4" />
                <line x1="814" y1="346" x2="826" y2="346" stroke="#13233a" stroke-width="4" />
                <circle id="s1-eyeL" cx="792" cy="348" r="5" fill="#13233a" />
                <circle id="s1-eyeR" cx="848" cy="348" r="5" fill="#13233a" />
                <path d="M776 322 Q792 314 808 322 M832 322 Q848 314 864 322" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
                <path d="M802 384 Q820 394 838 384" stroke="#13233a" stroke-width="4" stroke-linecap="round" fill="none" />
              </g>
              <!-- table -->
              <rect x="436" y="716" width="26" height="170" fill="#b79f70" stroke="#13233a" stroke-width="5" />
              <rect x="1398" y="716" width="26" height="170" fill="#b79f70" stroke="#13233a" stroke-width="5" />
              <rect x="380" y="690" width="1100" height="30" rx="6" fill="#d8c39a" stroke="#13233a" stroke-width="6" />
              <rect x="380" y="720" width="1100" height="10" fill="#13233a" opacity="0.12" />
              <!-- mug -->
              <ellipse cx="1126" cy="692" rx="46" ry="8" fill="#13233a" opacity="0.14" />
              <rect x="1098" y="632" width="56" height="58" rx="10" fill="#ffffff" stroke="#13233a" stroke-width="5" />
              <path d="M1154 646 Q1182 648 1180 668 Q1178 684 1154 682" fill="none" stroke="#13233a" stroke-width="5" />
              <path id="s1-steam1" d="M1114 618 Q1104 600 1116 584 Q1128 568 1116 552" stroke="#aebfd0" stroke-width="6" stroke-linecap="round" fill="none" />
              <path id="s1-steam2" d="M1132 618 Q1142 598 1130 582 Q1118 566 1130 548" stroke="#aebfd0" stroke-width="6" stroke-linecap="round" fill="none" />
              <path id="s1-steam3" d="M1148 620 Q1138 604 1148 590 Q1158 576 1148 562" stroke="#aebfd0" stroke-width="5" stroke-linecap="round" fill="none" />
              <!-- pill bottle -->
              <g id="s1-bottle">
                <ellipse cx="1266" cy="692" rx="44" ry="8" fill="#13233a" opacity="0.16" />
                <rect x="1236" y="612" width="60" height="78" rx="10" fill="#e0a33a" stroke="#13233a" stroke-width="5" />
                <rect x="1232" y="590" width="68" height="28" rx="6" fill="#ffffff" stroke="#13233a" stroke-width="5" />
                <rect x="1244" y="632" width="44" height="36" rx="4" fill="#ffffff" />
                <rect x="1250" y="640" width="32" height="5" rx="2" fill="#13233a" />
                <rect x="1250" y="651" width="22" height="5" rx="2" fill="#13233a" opacity="0.55" />
                <circle id="s1-ring1" cx="1266" cy="640" r="60" fill="none" stroke="#0e7c7b" stroke-width="6" opacity="0" />
                <circle id="s1-ring2" cx="1266" cy="640" r="60" fill="none" stroke="#0e7c7b" stroke-width="6" opacity="0" />
              </g>
              <circle cx="1336" cy="684" r="9" fill="#ffffff" stroke="#13233a" stroke-width="3" />
              <circle cx="1358" cy="688" r="9" fill="#ffffff" stroke="#13233a" stroke-width="3" />
              <!-- arms and hands -->
              <path d="M736 486 Q722 590 772 664" stroke="#13233a" stroke-width="52" stroke-linecap="round" fill="none" />
              <path d="M736 486 Q722 590 772 664" stroke="#0e7c7b" stroke-width="40" stroke-linecap="round" fill="none" />
              <path d="M904 486 Q950 580 1030 660" stroke="#13233a" stroke-width="52" stroke-linecap="round" fill="none" />
              <path d="M904 486 Q950 580 1030 660" stroke="#0e7c7b" stroke-width="40" stroke-linecap="round" fill="none" />
              <g id="s1-handL">
                <circle cx="776" cy="676" r="25" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
              </g>
              <g id="s1-handR">
                <circle cx="1038" cy="670" r="25" fill="#f2d6c0" stroke="#13233a" stroke-width="5" />
              </g>
            </svg>
          </div>
          <div id="s1-motes" class="s1-layer"></div>
        </div>
        <!-- front: out-of-focus leaves for depth -->
        <div id="s1-fg" class="s1-layer">
          <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <g fill="#0a5e5d">
              <path d="M-40 1100 C20 900 120 780 260 720 C240 840 180 980 90 1100 Z" />
              <path d="M40 1100 C140 960 280 900 420 900 C340 980 250 1060 190 1100 Z" opacity="0.92" />
              <path d="M-40 1100 C-30 960 -10 860 40 780 C100 880 110 1000 90 1100 Z" fill="#0e7c7b" />
            </g>
          </svg>
        </div>
        <div id="s1-cover" class="s1-layer"></div>
        <div id="s1-tag"><span class="s1-dot"></span><span class="s1-name">Walter, 92</span></div>
      
<audio id="s1-narration" src="assets/audio/s1-narration.wav" data-start="0.5" data-track-index="1" data-volume="1"></audio>
      </div>
      <script>
        (function () {

      // Seeded motes, so every render is identical.
      let seed = 1984;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
      const motes = document.getElementById("s1-motes");
      const moteEls = [];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement("i");
        const size = 6 + Math.floor(rnd() * 10);
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = 760 + Math.floor(rnd() * 760) + "px";
        el.style.top = 320 + Math.floor(rnd() * 460) + "px";
        el.style.opacity = "0";
        motes.appendChild(el);
        moteEls.push(el);
      }

      // Cue points, all derived from the narration so a new voice or pace re-times the scene.
      // Scene length is the root data-duration: keep it at NARR_START + narration + tail (checked below).
      const NARR_START = 0.5; // matches data-start of #s1-narration
      const S = window.NARRATION_S1.sentences;
      const nameAt = NARR_START + S[0].start + 0.1;                          // "Walter is ninety-two": tag slides in
      const medicineAt = NARR_START + S[1].start + 0.5 * (S[1].end - S[1].start); // "he started a new medicine": bottle pulses
      const SCENE_LEN = 6;
      if (NARR_START + window.NARRATION_S1.duration > SCENE_LEN) {
        console.warn("narration is longer than the scene: raise data-duration on #root and #scene");
      }

      const tl = gsap.timeline({ paused: true });

      // cover fades away
      tl.fromTo("#s1-cover", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power2.out" }, 0);

      // camera: a slow push-in that drifts from Walter to the bottle
      tl.fromTo("#s1-cam", { scale: 1.0, transformOrigin: "50% 50%" }, { scale: 1.1, duration: 6, ease: "none" }, 0);
      tl.fromTo("#s1-cam", { x: 20 }, { x: -40, duration: 3, ease: "sine.inOut" }, 0);
      tl.to("#s1-cam", { x: -190, duration: 2.8, ease: "sine.inOut" }, Math.max(medicineAt - 0.85, 1.5));
      tl.fromTo("#s1-back", { x: 0 }, { x: 28, duration: 6, ease: "none" }, 0);
      tl.fromTo("#s1-fg", { x: 0, scale: 1.0, transformOrigin: "0% 100%" }, { x: -70, scale: 1.12, duration: 6, ease: "none" }, 0);

      // light
      tl.fromTo("#s1-beam", { opacity: 0.15 }, { opacity: 0.22, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#s1-glow", { opacity: 0.8 }, { opacity: 1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // breathing
      gsap.set("#s1-torso", { svgOrigin: "820 740" });
      tl.fromTo("#s1-torso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      gsap.set("#s1-head", { svgOrigin: "820 430" });
      tl.fromTo("#s1-head", { rotation: -1 }, { rotation: 1.2, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // a blink
      gsap.set(["#s1-eyeL", "#s1-eyeR"], { svgOrigin: "820 348" });
      tl.to(["#s1-eyeL", "#s1-eyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 2.6);

      // hands tremble: small, quick, finite
      gsap.set("#s1-handL", { svgOrigin: "772 664" });
      gsap.set("#s1-handR", { svgOrigin: "1030 660" });
      tl.fromTo("#s1-handL", { rotation: -3.5 }, { rotation: 3.5, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 53 }, 1.0);
      tl.fromTo("#s1-handR", { rotation: 3 }, { rotation: -3, duration: 0.11, ease: "sine.inOut", yoyo: true, repeat: 43 }, 1.05);

      // steam
      gsap.set(["#s1-steam1", "#s1-steam2", "#s1-steam3"], { svgOrigin: "1130 620" });
      ["#s1-steam1", "#s1-steam2", "#s1-steam3"].forEach((id, i) => {
        tl.fromTo(id, { y: 10, opacity: 0 }, { y: -26, opacity: 0.85, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.2 + i * 0.3);
      });

      // motes drift up through the beam
      moteEls.forEach((el, i) => {
        const start = rnd() * 1.5;
        tl.fromTo(el, { opacity: 0, y: 0, x: 0 }, { opacity: 0.8, y: -70 - rnd() * 80, x: 30 + rnd() * 50, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, start);
      });

      // name tag: fast in, then hold
      tl.fromTo("#s1-tag", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.5)" }, nameAt);

      // "he started a new medicine": the bottle answers the words
      gsap.set("#s1-bottle", { svgOrigin: "1266 690" });
      tl.fromTo("#s1-bottle", { scale: 1 }, { scale: 1.1, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, medicineAt);
      gsap.set(["#s1-ring1", "#s1-ring2"], { opacity: 0, svgOrigin: "1266 640" });
      tl.fromTo("#s1-ring1", { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.7, duration: 1.1, ease: "power2.out", immediateRender: false }, medicineAt + 0.05);
      tl.fromTo("#s1-ring2", { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.7, duration: 1.1, ease: "power2.out", immediateRender: false }, medicineAt + 0.55);

      window.__timelines["scene-1"] = tl;
      tl.seek(0);
    
        })();
      </script>
    </template>
  </body>
</html>
