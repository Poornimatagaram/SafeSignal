      <script>
        (function () {
          const L = 0.4; // matches data-start of #s6-narration
          const N = window.NARRATION_S6.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 13.1;
          if (L + window.NARRATION_S6.duration > SCENE_LEN) {
            console.warn("scene 6 narration is longer than the scene: raise its data-duration in index.html");
          }
          const tl = gsap.timeline({ paused: true });
          gsap.set("#s6-cam", { transformOrigin: "50% 50%" });
          tl.fromTo("#s6-cam", { scale: 1.0 }, { scale: 1.04, duration: SCENE_LEN, ease: "none" }, 0);
          tl.fromTo("#s6-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // Walter stays at the centre, small, breathing
          gsap.set("#s6-walter", { svgOrigin: "960 1003" });
          tl.fromTo("#s6-walter", { scaleY: 1 }, { scaleY: 1.015, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 8 }, 0);

          // day cards pop in together, empty, at the start (they are the ladder)
          const pop = (sel, at, ox, oy) => {
            gsap.set(sel, { svgOrigin: ox + " " + oy, scale: 0.88, opacity: 0 });
            tl.to(sel, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, at);
          };
          const glow = (id, at) => {
            gsap.set("#" + id, { opacity: 0 });
            tl.to("#" + id, { opacity: 0.35, duration: 0.5, ease: "sine.out" }, at);
            tl.to("#" + id, { opacity: 0.18, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, at + 0.5);
          };
          const ping = (sel, at) => {
            gsap.set(sel, { opacity: 0 });
            tl.to(sel, { opacity: 1, duration: 0.2 }, at);
          };
          const ring = (n, at) => {
            gsap.set("#s6-ring" + n, { svgOrigin: "960 935", scale: 0.6, opacity: 0 });
            tl.to("#s6-ring" + n, { scale: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, at);
          };
          const person = (r, j, at) => {
            const sel = "#s6-pp" + r + j;
            gsap.set(sel, { opacity: 0, y: 30 });
            tl.to(sel, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, at);
          };

          // Day 1: "Miss one day, and his caregiver and care team are alerted."
          pop("#s6-p1", t(0) - 0.1, 390, 510);
          gsap.set("#s6-m1", { opacity: 0 });
          tl.to("#s6-m1", { opacity: 1, duration: 0.3 }, t(0) + 0.5);
          const alertAt = t(0) + 0.5 * (e(0) - t(0));
          ping("#s6-d1ping1", alertAt); glow("s6-d1glow1", alertAt);
          ping("#s6-d1ping2", alertAt + 0.4); glow("s6-d1glow2", alertAt + 0.4);
          ring(1, alertAt + 0.4); person(1, 0, alertAt + 0.5); person(1, 1, alertAt + 0.7);

          // Day 2: "Miss two, and it escalates."
          pop("#s6-p2", t(1) - 0.1, 960, 510);
          gsap.set("#s6-m2", { opacity: 0 });
          tl.to("#s6-m2", { opacity: 1, duration: 0.3 }, t(1) + 0.3);
          ping("#s6-d2ping1", t(1) + 0.6); ping("#s6-d2ping2", t(1) + 0.6);
          glow("s6-d2glow1", t(1) + 0.6); glow("s6-d2glow2", t(1) + 0.6);
          gsap.set("#s6-flag", { y: 70, opacity: 0 });
          tl.to("#s6-flag", { y: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, t(1) + 0.9);
          ring(2, t(1) + 0.9); person(2, 0, t(1) + 1.0); person(2, 1, t(1) + 1.15);

          // Day 3: "Miss three, and his emergency contacts are told."
          pop("#s6-p3", t(2) - 0.1, 1530, 510);
          gsap.set("#s6-m3", { opacity: 0 });
          tl.to("#s6-m3", { opacity: 1, duration: 0.3 }, t(2) + 0.3);
          const rowAt = [t(2) + 0.9, t(2) + 1.5, t(2) + 2.1];
          for (let k = 0; k < 3; k++) {
            gsap.set("#s6-ck" + k, { svgOrigin: (1270 + 62) + " " + ([435, 530, 620][k]), scale: 0, opacity: 0 });
            tl.to("#s6-ck" + k, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, rowAt[k]);
            gsap.set("#s6-rowbg" + k, { opacity: 0 });
            tl.to("#s6-rowbg" + k, { opacity: 1, duration: 0.4 }, rowAt[k]);
          }
          ring(3, t(2) + 1.2);
          person(3, 0, t(2) + 1.4); person(3, 1, t(2) + 1.8); person(3, 2, t(2) + 2.2);

          // "Nobody goes quiet alone.": the whole ladder settles, halo glows around Walter
          tl.to(["#s6-ring1", "#s6-ring2", "#s6-ring3"], { fillOpacity: 0.16, duration: 0.8, ease: "sine.inOut" }, t(3));
          tl.fromTo("#s6-walter", { y: 0 }, { y: -10, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t(3) + 0.3);

          window.__timelines["scene-6"] = tl;
          tl.seek(0);
        })();
