              <path d="M1210 504 Q1190 592 1226 660" stroke="#13233a" stroke-width="46" stroke-linecap="round" fill="none" />
              <path d="M1210 504 Q1190 592 1226 660" stroke="#0e7c7b" stroke-width="34" stroke-linecap="round" fill="none" />

              <g id="s3-wHandL"><circle cx="1228" cy="668" r="21" fill="#f2d6c0" stroke="#13233a" stroke-width="5" /></g>

              <!-- Dr. Shah asks -->
              <g id="s3-bubbleD">
                <polygon points="702,270 748,270 658,310" fill="#ffffff" stroke="#13233a" stroke-width="6" stroke-linejoin="round" />
                <rect x="690" y="166" width="430" height="108" rx="48" fill="#ffffff" stroke="#13233a" stroke-width="6" />
                <rect x="706" y="262" width="40" height="14" fill="#ffffff" />
                <text x="905" y="234" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="35" fill="#13233a">How have you been?</text>
              </g>
              <!-- Walter answers -->
              <g id="s3-bubbleW">
                <polygon points="1170,284 1216,284 1214,330" fill="#ffffff" stroke="#13233a" stroke-width="6" stroke-linejoin="round" />
                <rect x="1130" y="178" width="200" height="108" rx="48" fill="#ffffff" stroke="#13233a" stroke-width="6" />

              <!-- Walter's thought: the memory of two months ago fades -->

                <circle cx="1236" cy="292" r="9" fill="#ffffff" stroke="#13233a" stroke-width="5" />
                <circle cx="1224" cy="266" r="13" fill="#ffffff" stroke="#13233a" stroke-width="5" />
                <g fill="#13233a" stroke="#13233a" stroke-width="12"><circle cx="1130" cy="148" r="52" /><circle cx="1195" cy="118" r="62" /><circle cx="1270" cy="136" r="56" /><circle cx="1240" cy="183" r="58" /><circle cx="1160" cy="183" r="48" /></g>
                <g fill="#ffffff"><circle cx="1130" cy="148" r="52" /><circle cx="1195" cy="118" r="62" /><circle cx="1270" cy="136" r="56" /><circle cx="1240" cy="183" r="58" /><circle cx="1160" cy="183" r="48" /></g>
                <text x="1212" y="126" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="28" fill="#4a5a70">2 months ago</text>

                  <g fill="#e0705f" stroke="#b84a3a" stroke-width="1.5">
                    <circle cx="1190" cy="153" r="5" /><circle cx="1207" cy="166" r="5" /><circle cx="1224" cy="152" r="5" /><circle cx="1240" cy="165" r="5" /><circle cx="1212" cy="151" r="4" />
                  </g>
                </g>

        <!-- front leaves -->
        <div id="s3-fg" class="s3-layer">
          <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <g fill="#0a5e5d">
              <path d="M-40 1100 C20 900 120 780 260 720 C240 840 180 980 90 1100 Z" />
              <path d="M40 1100 C140 960 280 900 420 900 C340 980 250 1060 190 1100 Z" opacity="0.92" />
              <path d="M-40 1100 C-30 960 -10 860 40 780 C100 880 110 1000 90 1100 Z" fill="#0e7c7b" />
            </g>
          </svg>
        </div>
        <div id="s3-cover" class="s3-layer"></div>
        <div id="s3-tag"><span class="s3-dot"></span><span class="s3-name">Doctor: a blank page</span></div>
        <audio id="s3-narration" src="assets/audio/s3-narration.wav" data-start="0.4" data-track-index="1" data-volume="1"></audio>
      </div>
      <script>
        (function () {
          // Beats are placed from the narration's sentence times (tools/narrate.py), so a new voice or pace re-times them.
          const L = 0.4; // matches data-start of #s3-narration
          const N = window.NARRATION_S3.sentences;
          const t = (i) => L + N[i].start;
          const e = (i) => L + N[i].end;
          const SCENE_LEN = 12.7;
          if (L + window.NARRATION_S3.duration > SCENE_LEN) {
            console.warn("scene 3 narration is longer than the scene: raise its data-duration in index.html");
          }

          // camera: top-left origin, so x = 960 - s * Px and y = 540 - s * Py centres the point (Px, Py)
          const cam = (px, py, s) => ({ x: 960 - s * px, y: 540 - s * py, scale: s });
          const WIDE = cam(960, 540, 1.0), TALK = cam(930, 440, 1.3), CHART = cam(1600, 300, 1.8);

          const tl = gsap.timeline({ paused: true });
          gsap.set("#s3-cam", { transformOrigin: "0 0", ...WIDE });
          tl.to("#s3-cam", { ...TALK, duration: 1.1, ease: "power2.inOut" }, t(1) - 0.4);
          tl.to("#s3-cam", { ...CHART, duration: 1.2, ease: "power2.inOut" }, t(4) - 0.45);
          tl.fromTo("#s3-fg", { x: 0 }, { x: -50, duration: 12.7, ease: "none" }, 0);
          tl.fromTo("#s3-cover", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);

          // breathing and blinks
          gsap.set("#s3-dTorso", { svgOrigin: "600 740" });
          tl.fromTo("#s3-dTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
          gsap.set("#s3-wTorso", { svgOrigin: "1275 670" });
          tl.fromTo("#s3-wTorso", { scaleY: 1 }, { scaleY: 1.012, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.2);
          gsap.set(["#s3-dEyeL", "#s3-dEyeR"], { svgOrigin: "600 353" });
          tl.to(["#s3-dEyeL", "#s3-dEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 2.2);
          gsap.set(["#s3-wEyeL", "#s3-wEyeR"], { svgOrigin: "820 348" });
          tl.to(["#s3-wEyeL", "#s3-wEyeR"], { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 6.0);
          gsap.set("#s3-wHead", { svgOrigin: "820 430" });
          tl.fromTo("#s3-wHead", { rotation: -1 }, { rotation: 1, duration: 3.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
          gsap.set("#s3-wHandL", { svgOrigin: "1226 660" });
          gsap.set("#s3-wHandR", { svgOrigin: "1324 660" });
          tl.fromTo("#s3-wHandL", { rotation: -3 }, { rotation: 3, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 99 }, 0.3);
          tl.fromTo("#s3-wHandR", { rotation: 2.5 }, { rotation: -2.5, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 82 }, 0.35);

          // "His doctor gets ten minutes": the ring on the clock runs down
          const ring = document.getElementById("s3-ring");
          const circ = 2 * Math.PI * 78;
          gsap.set(ring, { strokeDasharray: circ, strokeDashoffset: 0 });
          gsap.set("#s3-clock", { svgOrigin: "330 230" });
          tl.fromTo("#s3-clock", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, t(0) + 0.1);
          tl.to(ring, { strokeDashoffset: circ, duration: Math.max(e(0) - t(0) - 0.6, 1.2), ease: "none" }, t(0) + 0.6);

          // "How have you been?": the doctor leans in and asks
          gsap.set("#s3-bubbleD", { svgOrigin: "658 310", scale: 0, opacity: 0 });
          tl.to("#s3-bubbleD", { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, t(1) + 0.05);
          gsap.set("#s3-dHead", { svgOrigin: "600 430" });
          tl.fromTo("#s3-dHead", { rotation: 0 }, { rotation: -4, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, t(1) + 0.1);

          // "Fine.": Walter answers, a small shrug; the question fades
          tl.to("#s3-bubbleD", { opacity: 0, scale: 0.9, duration: 0.3 }, t(2) - 0.1);
          gsap.set("#s3-bubbleW", { svgOrigin: "1214 330", scale: 0, opacity: 0 });
          tl.to("#s3-bubbleW", { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, t(2) + 0.05);
          tl.fromTo("#s3-wHead", { y: 0 }, { y: -8, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, t(2) + 0.1);
          tl.to("#s3-bubbleW", { opacity: 0, scale: 0.9, duration: 0.3 }, t(3) - 0.15);

          // "He's forgotten how he felt two months ago.": a thought of two months ago, and the memory dissolves into a question
          const forgetAt = t(3) + 0.5 * (e(3) - t(3)); // "how he felt": the memory starts to fade
          gsap.set("#s3-thought", { svgOrigin: "1236 292", scale: 0, opacity: 0 });
          tl.to("#s3-thought", { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, t(3) + 0.05);
          gsap.set("#s3-memory", { svgOrigin: "1212 159" });
          tl.to("#s3-memory", { opacity: 0, scale: 0.6, duration: 0.8, ease: "power1.in" }, forgetAt);
          gsap.set("#s3-memq", { svgOrigin: "1212 176", scale: 0, opacity: 0 });
          tl.to("#s3-memq", { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, forgetAt + 0.6);
          tl.to("#s3-thought", { opacity: 0, scale: 0.9, duration: 0.3 }, t(4) - 0.45);

          // "So the months in between stay blank.": the chart, the long empty stretch, then a blank page
          const sheetAt = t(4) + 0.55 * (e(4) - t(4)); // "stay blank"
          gsap.set("#s3-q", { svgOrigin: "1600 290", scale: 0, opacity: 0 });
          tl.to("#s3-q", { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, t(4) + 0.45);
          tl.fromTo("#s3-q", { rotation: -8 }, { rotation: 8, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, t(4) + 0.85);
          gsap.set("#s3-sheet", { svgOrigin: "1600 305", scale: 0, opacity: 0, rotation: -6 });
          tl.to("#s3-q", { opacity: 0, duration: 0.2 }, sheetAt - 0.1);
          tl.to("#s3-sheet", { scale: 1, opacity: 1, rotation: -2, duration: 0.5, ease: "back.out(1.6)" }, sheetAt);
          tl.fromTo("#s3-tag", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.5)" }, t(4) + 0.3);

          window.__timelines["scene-3"] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
