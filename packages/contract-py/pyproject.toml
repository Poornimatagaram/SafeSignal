[project]
name = "sentinel-contract"
version = "1.0.0"
description = "Sentinel contract helpers: canonical JSON, payload hashing, JSON Schema validation, patient-side client"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "httpx>=0.27",
    "pynacl>=1.6.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
