[project]
name = "sentinel"
version = "0.1.0"
description = "Side-Effect Sentinel: schema contract, Sentinel service and client helpers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "pynacl>=1.6.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
