[project]
name = "sentinel-patient"
version = "0.1.0"
description = "Sentinel patient runtime: on-device speech-to-text, rating, filter, extraction and egress gate (owner: patient side)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentinel-contract",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.sources]
sentinel-contract = { path = "../../packages/contract-py", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
