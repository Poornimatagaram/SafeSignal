[project]
name = "sentinel-patient"
version = "0.1.0"
description = "Sentinel patient runtime: on-device speech-to-text, rating, filter, extraction and egress gate (owner: patient side)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentinel-contract",
    "faster-whisper>=1.2.1",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "ollama>=0.6.3",
    "en-core-web-lg",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.sources]
sentinel-contract = { path = "../../packages/contract-py", editable = true }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
