[project]
name = "sentinel-service"
version = "0.1.0"
description = "Sentinel service: company DB, relay store, API and scheduler (owner: company side)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentinel-contract",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.sources]
sentinel-contract = { path = "../../packages/contract-py", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
